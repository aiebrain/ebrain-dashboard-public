<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ebrain OS 업무 대시보드</title>
  <link rel="stylesheet" href="styles.css?v=public-pages-20260610a" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">EB</div>
        <div class="brand-copy">
          <strong>Ebrain OS</strong>
          <span>업무 관제판</span>
        </div>
        <button class="sidebar-toggle" type="button" data-sidebar-toggle aria-label="왼쪽 메뉴 접기" title="왼쪽 메뉴 접기">‹</button>
      </div>
      <nav id="sidebarNav" class="sidebar-nav" aria-label="업무 메뉴"></nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <span>Local-first · Meta 리타겟팅 준비</span>
      </div>
    </aside>

    <main class="main-panel">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="pageEyebrow">오늘</p>
          <h1 id="pageTitle">관제판</h1>
          <p id="pageDescription" class="page-description">오늘 처리해야 할 업무와 전환 흐름을 한눈에 봅니다.</p>
        </div>
        <div class="topbar-actions">
          <button class="ghost" id="backupJsonBtn">JSON 백업</button>
          <button class="ghost" id="exportCsvBtn">현재 CSV</button>
          <button class="primary" data-route="settings">설정</button>
        </div>
      </header>

      <section id="kpiCards" class="kpi-grid" aria-label="핵심 지표"></section>
      <section id="routeContent" class="content-card" aria-live="polite"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=public-pages-20260610a"></script>
</body>
</html>
